; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = https://github.com/platformio/platform-espressif32.git

;platform = espressif32
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
framework = arduino
board_build.flash_size = 16MB
; *** ENTSCHEIDEND: die Platine ist mit 8 MB hinterlegt; ohne diese Zeile wird der
; Bootloader als 8-MB-Fassung geschrieben und weist Partitionen jenseits von 8 MB
; zurück, was in einer Startschleife endet. ***
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
monitor_speed = 115200
board_build.psram = enabled
; N16R8 heißt PSRAM im Octal-Betrieb (OPI): erst diese Zeile schaltet ihn wirklich ein.
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_custom.csv
board_build.filesystem = littlefs
build_flags =
	-D PIO_FRAMEWORK_ARDUINO_SPIFFS_ENABLE
	-D PIO_FRAMEWORK_ARDUINO_LITTLEFS_ENABLE
	-D BOARD_HAS_PSRAM

lib_deps =
	adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0
	adafruit/Adafruit GFX Library @ ^1.11.11
	adafruit/Adafruit BusIO @ ^1.16.1
	adafruit/Adafruit NeoPixel @ ^1.12.3
	baldram/ESP_VS1053_Library @ ^1.1.4
	bblanchon/ArduinoJson @ ^7.2.1
	ruiseixasm/Versatile_RotaryEncoder @ ^1.3.1
	; TFLite Micro für das Weckwort "Hey Jarvis", siehe WAKEWORD.md. Die
	; Arduino-Fassung mit aktuellem TFLM (v2.0.0, Juli 2024). Hereingezogen wird sie
	; über TFL_SELFTEST und WAKE_ENABLE: mit WAKE_ENABLE=1, der Werkseinstellung,
	; gehört sie zum Build.
	https://github.com/spaziochirale/Chirale_TensorFlowLite.git

; --- AUFSPIELEN ---
; Über USB: EINMAL nötig, um die Firmware samt eingeschalteter Aktualisierung
; über Funk aufzuspielen. Danach zum Flashen über WLAN die beiden USB-Zeilen
; auskommentieren und die beiden Funk-Zeilen freigeben.
;upload_port = COMx        ; die serielle Schnittstelle deiner Platine (etwa COM3, /dev/ttyUSB0)
;upload_protocol = esptool
; --- Aktualisierung über WLAN (mDNS-Name, unempfindlich gegen wechselnde IP) ---
upload_port = alexo.local
upload_protocol = espota
